<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Page 07 - Мерехтливий текст</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .blink {
      background: linear-gradient(
        45deg,
        rgba(255, 0, 150, 1) 0%,
        rgba(0, 204, 255, 1) 100%
      );
      background-blend-mode: multiply;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      border-radius: 10px;
      width: fit-content;
      margin: 100px auto;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <p class="blink">Мерехтливий текст</p>

  <script>
    function blink_text() {
      $('.blink').fadeOut(500);
      $('.blink').fadeIn(500);
    }

    setInterval(blink_text, 1000);

    // Додаємо стилі (імітація підключення окремого CSS)
    $(document).ready(function() {
      $("p").append("<style>.blink { border: 2px solid white; }</style>");
    });
  </script>

</body>
</html>
